  id here. Strokes use currentColor so the builder's own theming applies.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <symbol id="header" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="6" rx="1"/><path d="M3 14h12M3 18h8"/>
  </symbol>

  <symbol id="quote-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
